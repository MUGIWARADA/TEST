services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: miroir
      POSTGRES_PASSWORD: miroir
      POSTGRES_DB: miroir
    ports:
      - "5432:5432"
    volumes:
      - miroir-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miroir -d miroir"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  miroir-postgres:
