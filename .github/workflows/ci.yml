name: Workflow CI

on:
  push:
    paths:
      - 'frontend--/**'
      - 'backend/**'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - 'README.md'
  pull_request:
    paths:
      - 'frontend--/**'
      - 'backend/**'
      - 'docs/**'
      - '.github/workflows/ci.yml'
      - 'README.md'
  workflow_dispatch:

concurrency:
  group: workflow-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend--/package-lock.json
      - run: npm ci
        working-directory: frontend--
      - run: npm run lint
        working-directory: frontend--
      - run: npm run build
        working-directory: frontend--

  backend:
    name: Backend tests and build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: miroir
          POSTGRES_PASSWORD: miroir
          POSTGRES_DB: miroir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U miroir -d miroir_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      DATABASE_URL: postgres://miroir:miroir@localhost:5432/miroir_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run db:migrate
        working-directory: backend
      - run: npm test
        working-directory: backend
      - run: npm run lint
        working-directory: backend
      - run: npm run build
        working-directory: backend
